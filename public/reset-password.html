<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Reset password | LearnTurkish AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
  :root{--r:#E30A17;--bg:#0A0A0B;--t1:#F5F5F7;--t3:rgba(255,255,255,0.45);--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.09);--font:'Inter','Segoe UI',Roboto,Arial,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:36px;width:100%;max-width:400px;text-align:center}
  h1{font-size:22px;font-weight:900;margin:12px 0 6px}
  p{color:var(--t3);font-size:14px;line-height:1.5;margin-bottom:22px}
  .inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--t1);font-size:15px;font-family:var(--font);outline:none;margin-bottom:12px}
  .btn{width:100%;background:var(--r);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font)}
  .btn:disabled{opacity:.5}
  .msg{font-size:13px;margin-top:12px;display:none;line-height:1.5}
</style>
</head>
<body>
<div class="box" id="box">
  <div style="font-size:44px">🔑</div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div id="form" style="display:none">
    <input type="password" class="inp" id="p1" autocomplete="new-password">
    <input type="password" class="inp" id="p2" autocomplete="new-password" onkeydown="if(event.key==='Enter')save()">
    <button class="btn" id="btn" onclick="save()"></button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Uygulamadaki "Sifremi unuttum" (app/index.tsx handleForgotPassword) bu sayfaya
// yonlendiriyordu ama sayfa hic yoktu. Supabase recovery linki #access_token ile gelir.
const SUPABASE_URL = 'https://ilxahosomxpgokyilpco.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlseGFob3NvbXhwZ29reWlscGNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjA2MTcsImV4cCI6MjA4OTIzNjYxN30.p7LB1qmOZ7_Nq1udQVU-BHMF8VRHjP9QmJtu6ZLTVU8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, detectSessionInUrl: false, autoRefreshToken: false },
  global: { headers: { apikey: SUPABASE_KEY } },
});
const T = {
  en: { title:'Set a new password', sub:'Choose a new password for your LearnTurkish AI account.', p1:'New password (min. 8 characters)', p2:'Repeat new password', btn:'Save password', short:'Password must be at least 8 characters.', diff:'Passwords do not match.', ok:'Your password has been changed. You can now sign in to the LearnTurkish AI app with your new password.', bad:'This link is invalid or has expired. Please request a new one from the app ("Forgot password").', err:'Could not save: ' },
  tr: { title:'Yeni şifre belirle', sub:'LearnTurkish AI hesabın için yeni bir şifre seç.', p1:'Yeni şifre (en az 8 karakter)', p2:'Yeni şifre (tekrar)', btn:'Şifreyi kaydet', short:'Şifre en az 8 karakter olmalı.', diff:'Şifreler aynı değil.', ok:'Şifren değiştirildi. Artık LearnTurkish AI uygulamasına yeni şifrenle giriş yapabilirsin.', bad:'Bu link geçersiz ya da süresi dolmuş. Uygulamadan ("Şifremi unuttum") yeni bir link iste.', err:'Kaydedilemedi: ' },
  ru: { title:'Новый пароль', sub:'Придумайте новый пароль для аккаунта LearnTurkish AI.', p1:'Новый пароль (минимум 8 символов)', p2:'Повторите новый пароль', btn:'Сохранить пароль', short:'Пароль должен содержать не менее 8 символов.', diff:'Пароли не совпадают.', ok:'Пароль изменён. Теперь вы можете войти в приложение LearnTurkish AI с новым паролем.', bad:'Ссылка недействительна или устарела. Запросите новую в приложении ("Забыли пароль").', err:'Не удалось сохранить: ' },
};
const lang = (navigator.language || 'en').slice(0,2).toLowerCase();
const L = T[lang] || T.en;
document.documentElement.lang = T[lang] ? lang : 'en';
const $ = id => document.getElementById(id);
$('title').textContent = L.title; $('sub').textContent = L.sub;
$('p1').placeholder = L.p1; $('p2').placeholder = L.p2; $('btn').textContent = L.btn;
function show(text, ok){ const m=$('msg'); m.textContent=text; m.style.color= ok ? '#00C853' : '#FF6B6B'; m.style.display='block'; }

(async () => {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  history.replaceState(null, '', location.pathname);
  if (!p.get('access_token')) { show(L.bad, false); return; }
  const { error } = await db.auth.setSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token') });
  if (error) { show(L.bad, false); return; }
  $('form').style.display = 'block';
  $('p1').focus();
})();

async function save(){
  const a = $('p1').value, b = $('p2').value;
  if (a.length < 8) { show(L.short, false); return; }
  if (a !== b) { show(L.diff, false); return; }
  $('btn').disabled = true;
  const { error } = await db.auth.updateUser({ password: a });
  $('btn').disabled = false;
  if (error) { show(L.err + error.message, false); return; }
  $('form').style.display = 'none';
  $('sub').style.display = 'none';
  show(L.ok, true);
  db.auth.signOut();
}
</script>
</body>
</html>
