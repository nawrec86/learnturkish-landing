<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Yönetim Paneli | LearnTurkish AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  :root{--r:#E30A17;--bg:#0A0A0B;--t1:#F5F5F7;--t2:rgba(255,255,255,0.72);--t3:rgba(255,255,255,0.42);--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.09);--green:#00C853;--gold:#F5C518;--blue:#60A5FA;--orange:#FF9F43;--font:'Inter','Segoe UI',Roboto,Arial,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;font-size:14px}
  a{color:var(--blue)}
  button{font-family:var(--font)}
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px;width:100%;max-width:400px;text-align:center}
  .login-box h1{font-size:24px;font-weight:900;margin-bottom:6px}
  .login-box p{color:var(--t3);margin-bottom:28px}
  .inp,.form-inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--t1);font-size:14px;font-family:var(--font);outline:none}
  .inp{padding:14px 18px;margin-bottom:12px;font-size:15px}
  .inp:focus,.form-inp:focus{border-color:rgba(227,10,23,0.6)}
  select.form-inp option{background:#1a1a1c}
  .btn{background:var(--r);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
  .btn.block{width:100%;padding:14px}
  .btn.ghost{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--t2);font-weight:700}
  .btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}
  .error{color:#FF6B6B;font-size:13px;margin-top:8px;display:none}
  #app{display:none}
  nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(10,10,11,0.95);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .brand{font-weight:900;font-size:17px}.brand span{color:var(--r)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--t3)}
  .tab.active{background:var(--r);color:#fff;border-color:var(--r)}
  .who{color:var(--t3);font-size:12px;display:flex;gap:10px;align-items:center}
  .main{padding:24px;max-width:1200px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px}
  .card h3{font-size:15px;font-weight:800;margin-bottom:14px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
  .stat .num{font-size:26px;font-weight:900}
  .stat.click{cursor:pointer;transition:border-color .15s,background .15s}.stat.click:hover{border-color:rgba(227,10,23,0.6);background:rgba(227,10,23,0.06)}
  .stat.click .lbl::after{content:' ›';opacity:.6}
  tr.clickrow{cursor:pointer}tr.clickrow:hover td{background:rgba(255,255,255,0.04)}
  .modal.wide{max-width:1000px}.stat .lbl{font-size:12px;color:var(--t3);margin-top:2px}
  .fg{display:flex;flex-direction:column;gap:6px}.fg label{font-size:12px;font-weight:700;color:var(--t3)}
  .full{grid-column:1/-1}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:start;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--t2);vertical-align:middle}
  tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,0.03)}
  .badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-green{background:rgba(0,200,83,0.15);color:var(--green)}
  .b-gold{background:rgba(245,197,24,0.15);color:var(--gold)}
  .b-red{background:rgba(255,80,80,0.15);color:#FF6B6B}
  .b-blue{background:rgba(96,165,250,0.15);color:var(--blue)}
  .b-grey{background:rgba(255,255,255,0.08);color:var(--t3)}
  .b-orange{background:rgba(255,159,67,0.15);color:var(--orange)}
  .muted{color:var(--t3)}.small{font-size:12px}
  .bar{height:8px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;display:flex}
  .bar>div{height:100%}
  .back{color:var(--t3);cursor:pointer;margin-bottom:12px;display:inline-block}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px}
  .modal{background:#141416;border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:640px}
  .modal h3{font-size:17px;font-weight:900;margin-bottom:16px}
  .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .days label{display:inline-flex;align-items:center;gap:4px;margin-inline-end:10px;color:var(--t2)}
  #toast{position:fixed;bottom:24px;inset-inline-end:24px;padding:12px 20px;border-radius:12px;font-weight:700;display:none;z-index:200;max-width:420px}
  .empty{text-align:center;color:var(--t3);padding:20px}
  textarea.form-inp{resize:vertical}
  @media (max-width:640px){.main{padding:16px}nav{padding:12px 16px}}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div style="font-size:44px;margin-bottom:14px">🎓</div>
    <h1>LearnTurkish AI</h1>
    <p>Yönetim ve Özel Ders Paneli</p>
    <input type="email" class="inp" id="email" placeholder="E-posta" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('pwd').focus()">
    <input type="password" class="inp" id="pwd" placeholder="Şifre" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn block" id="loginBtn" onclick="doLogin()">Giriş Yap</button>
    <div class="error" id="loginError"></div>
    <a href="javascript:void(0)" onclick="forgotPassword()" class="small" style="display:inline-block;margin-top:14px;color:var(--t3)">Şifremi unuttum / ilk kez giriş</a>
  </div>
</div>

<div id="app">
  <nav>
    <div class="brand">LearnTurkish <span>Panel</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="who"><span id="whoLbl"></span><button class="btn ghost sm" onclick="logout()">Çıkış</button></div>
  </nav>
  <div class="main" id="view"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ilxahosomxpgokyilpco.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlseGFob3NvbXhwZ29reWlscGNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjA2MTcsImV4cCI6MjA4OTIzNjYxN30.p7LB1qmOZ7_Nq1udQVU-BHMF8VRHjP9QmJtu6ZLTVU8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false, storageKey: 'lt_teach_auth' },
  global: { headers: { apikey: SUPABASE_KEY } },
});

// ---------------------------------------------------------------------------
// Sabitler
// ---------------------------------------------------------------------------
const LEVELS = ['A0','A1','A2','B1','B2','C1','C2'];
const HEARD = { instagram:'Instagram', tiktok:'TikTok', youtube:'YouTube', google:'Google', app_store:'App Store / Google Play', friend:'Arkadaş tavsiyesi', other:'Diğer' };
const STUDENT_STATUS = { lead:['Aday','b-gold'], active:['Aktif','b-green'], paused:['Beklemede','b-orange'], completed:['Tamamladı','b-blue'], archived:['Arşiv','b-grey'] };
const COURSE_STATUS = { planned:['Planlandı','b-gold'], active:['Devam ediyor','b-green'], paused:['Durduruldu','b-orange'], completed:['Tamamlandı','b-blue'], cancelled:['İptal','b-grey'] };
const ATT = { scheduled:['Planlı','b-grey'], attended:['Katıldı','b-green'], late:['Geç katıldı','b-gold'], absent:['Gelmedi','b-red'], excused:['İzinli','b-blue'], cancelled:['İptal','b-grey'] };
const HW = { assigned:['Verildi','b-gold'], submitted:['Teslim edildi','b-blue'], reviewed:['Değerlendirildi','b-green'], missing:['Teslim yok','b-red'] };
const SKILLS = [['speaking','Konuşma'],['listening','Dinleme'],['reading','Okuma'],['writing','Yazma'],['grammar','Dilbilgisi'],['vocabulary','Kelime'],['pronunciation','Telaffuz'],['participation','Derse katılım']];
const WEEKDAYS = [[1,'Pzt'],[2,'Sal'],[3,'Çar'],[4,'Per'],[5,'Cum'],[6,'Cmt'],[0,'Paz']];

let ME = { is_admin:false, tutor_id:null, tutor_name:null };
let TUTORS = [];

// ---------------------------------------------------------------------------
// Yardimcilar
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
function esc(v){ return v==null ? '' : String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(map, key){ const m = map[key] || [key,'b-grey']; return `<span class="badge ${m[1]}">${esc(m[0])}</span>`; }
function toast(msg, ok=true){ const t=$('toast'); t.textContent=msg; t.style.background= ok ? '#00A844' : '#C62828'; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ok?2500:6000); }
// Supabase yazma hatalari throw etmez, { error } doner -> her cagriyi bundan gecir.
async function q(p){ const { data, error } = await p; if (error) { console.error(error); throw new Error(error.message || 'İşlem başarısız'); } return data; }
async function run(fn, okMsg){ try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch(e){ toast('Hata: ' + e.message, false); throw e; } }
function fmtDT(v){ if(!v) return '<span class="muted">-</span>'; const d=new Date(v); return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function fmtD(v){ if(!v) return '-'; return new Date(v).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'}); }
function toLocalInput(v){ if(!v) return ''; const d=new Date(v); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fromLocalInput(v){ return v ? new Date(v).toISOString() : null; }
function money(n, cur='USD'){ return (cur==='USD'?'$':'') + Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2}) + (cur==='USD'?'':' '+cur); }
function opt(map, sel){ return Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(Array.isArray(v)?v[0]:v)}</option>`).join(''); }
function tutorName(id){ const t=TUTORS.find(x=>x.id===id); return t ? t.full_name : '-'; }
function tutorOptions(sel, allowEmpty=true){ return (allowEmpty?'<option value="">- Atanmadı -</option>':'') + TUTORS.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.full_name)}${t.is_active?'':' (pasif)'}</option>`).join(''); }
function val(id){ const e=$(id); if(!e) return null; const v=e.value.trim(); return v===''?null:v; }
function openModal(html){ $('modal').innerHTML=html; $('modalBg').style.display='flex'; }
function closeModal(){ $('modalBg').style.display='none'; $('modal').innerHTML=''; $('modal').classList.remove('wide'); }
function attendanceBar(lessons){
  const n = lessons.length || 1;
  const c = k => lessons.filter(l=>l.attendance===k).length;
  const seg = (k,color) => c(k) ? `<div style="width:${c(k)/n*100}%;background:${color}" title="${ATT[k][0]}: ${c(k)}"></div>` : '';
  return `<div class="bar">${seg('attended','var(--green)')}${seg('late','var(--gold)')}${seg('excused','var(--blue)')}${seg('absent','#FF6B6B')}${seg('cancelled','#555')}</div>`;
}

// ---------------------------------------------------------------------------
// Giriş
// ---------------------------------------------------------------------------
function showLoginError(m){ const e=$('loginError'); e.textContent=m; e.style.display='block'; }
async function doLogin(){
  $('loginError').style.display='none';
  const email=$('email').value.trim(), password=$('pwd').value;
  if(!email||!password){ showLoginError('E-posta ve şifre gerekli'); return; }
  $('loginBtn').disabled=true;
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  $('loginBtn').disabled=false;
  if(error||!data.session){ showLoginError('Geçersiz e-posta veya şifre'); return; }
  await enter();
}
async function enter(){
  const { data, error } = await db.rpc('tuition_whoami');
  if (error) { await db.auth.signOut(); showLoginError('Özel ders modülü henüz kurulmamış (tuition_whoami yok). Yöneticiye bildirin.'); return; }
  ME = data || {};
  if (!ME.is_admin && !ME.tutor_id) {
    await db.auth.signOut();
    showLoginError('Bu hesap bir öğretmen kaydına bağlı değil ya da öğretmen pasif. Yönetici "Öğretmenler" sekmesinden bağlamalı.');
    return;
  }
  $('login').style.display='none'; $('app').style.display='block';
  $('whoLbl').textContent = ME.is_admin ? 'Yönetici' : ('Öğretmen: ' + (ME.tutor_name||''));
  await loadTutors();
  buildTabs();
  route();
}
async function logout(){ await db.auth.signOut(); location.hash=''; location.reload(); }
async function loadTutors(){ TUTORS = await q(db.from('tutors').select('id,full_name,is_active,user_id,meet_link,zoom_link,bio,languages').order('full_name')); }

// ---------------------------------------------------------------------------
// Yonlendirme (#/home, #/students, #/student/<id>, #/course/<id>, #/tutors, #/requests)
// ---------------------------------------------------------------------------
function buildTabs(){
  const tabs = [['home','Bugün'],['students','Öğrenciler']];
  if (ME.is_admin) tabs.push(['requests','Talepler'],['tutors','Öğretmenler'],['overview','Genel Bakış'],['settings','Ayarlar']);
  $('tabs').innerHTML = tabs.map(([k,l])=>`<button class="tab" data-tab="${k}" onclick="location.hash='#/${k}'">${l}</button>`).join('');
}
window.addEventListener('hashchange', () => { if (!/access_token=/.test(location.hash)) route(); });
function route(){
  if ($('app').style.display!=='block') return;
  const [, page, id] = (location.hash || '#/home').split('/');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===page || (page==='student'&&t.dataset.tab==='students') || (page==='course'&&t.dataset.tab==='students')));
  $('view').innerHTML = '<div class="empty">Yükleniyor...</div>';
  const pages = { home:viewHome, students:viewStudents, student:viewStudent, course:viewCourse, tutors:viewTutors, requests:viewRequests, overview:viewOverview, settings:viewSettings };
  if (!ME.is_admin && ['tutors','requests','overview','settings'].includes(page)) { location.hash = '#/home'; return; }
  (pages[page] || viewHome)(id).catch(e => { $('view').innerHTML = `<div class="card"><b>Hata:</b> ${esc(e.message)}</div>`; });
}

// ---------------------------------------------------------------------------
// BUGUN: yaklasan dersler, katılım girilmemiş dersler, degerlendirme bekleyen ödevler
// ---------------------------------------------------------------------------
async function viewHome(){
  const now = new Date();
  const weekLater = new Date(now.getTime()+7*864e5).toISOString();
  const [upcoming, unmarked, toReview, courses] = await Promise.all([
    q(db.from('tuition_lessons').select('id,lesson_no,topic,scheduled_at,meet_link,course_id,tuition_courses!inner(id,title,tutor_id,status,tuition_students!inner(id,full_name))')
      .eq('attendance','scheduled').gte('scheduled_at', now.toISOString()).lte('scheduled_at', weekLater).order('scheduled_at')),
    q(db.from('tuition_lessons').select('id,lesson_no,topic,scheduled_at,course_id,tuition_courses!inner(id,title,tuition_students!inner(id,full_name))')
      .eq('attendance','scheduled').lt('scheduled_at', now.toISOString()).order('scheduled_at')),
    q(db.from('tuition_homework').select('id,title,submitted_at,course_id,tuition_courses!inner(id,tuition_students!inner(full_name))').eq('status','submitted').order('submitted_at')),
    q(db.from('tuition_courses').select('id,status').in('status',['planned','active'])),
  ]);
  const lessonRow = (l, showJoin) => `<tr class="click" onclick="location.hash='#/course/${l.course_id}'">
      <td>${fmtDT(l.scheduled_at)}</td><td><b>${esc(l.tuition_courses.tuition_students.full_name)}</b></td>
      <td>Ders ${l.lesson_no}${l.topic?' - '+esc(l.topic):''}</td>
      <td>${showJoin && l.meet_link ? `<a href="${esc(l.meet_link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Meet</a>` : ''}</td></tr>`;
  $('view').innerHTML = `
    <div class="stats">
      <div class="stat click" onclick="location.hash='#/students'"><div class="num">${courses.length}</div><div class="lbl">Aktif / planlı kur</div></div>
      <div class="stat click" onclick="document.getElementById('h-upcoming').scrollIntoView({behavior:'smooth'})"><div class="num">${upcoming.length}</div><div class="lbl">7 gün içinde ders</div></div>
      <div class="stat click" onclick="(document.getElementById('h-unmarked')||document.getElementById('h-upcoming')).scrollIntoView({behavior:'smooth'})"><div class="num" style="color:${unmarked.length?'#FF6B6B':'inherit'}">${unmarked.length}</div><div class="lbl">Katılımı girilmemiş</div></div>
      <div class="stat click" onclick="(document.getElementById('h-review')||document.getElementById('h-upcoming')).scrollIntoView({behavior:'smooth'})"><div class="num" style="color:${toReview.length?'var(--gold)':'inherit'}">${toReview.length}</div><div class="lbl">Değerlendirilecek ödev</div></div>
    </div>
    ${unmarked.length ? `<div class="card" id="h-unmarked"><h3>⚠️ Katılım ve gözlem bekleyen dersler</h3><div class="tbl-wrap"><table><thead><tr><th>Tarih</th><th>Öğrenci</th><th>Ders</th><th></th></tr></thead><tbody>${unmarked.map(l=>lessonRow(l,false)).join('')}</tbody></table></div></div>` : ''}
    <div class="card" id="h-upcoming"><h3>📅 Önümüzdeki 7 gün</h3>${upcoming.length ? `<div class="tbl-wrap"><table><thead><tr><th>Tarih</th><th>Öğrenci</th><th>Ders</th><th></th></tr></thead><tbody>${upcoming.map(l=>lessonRow(l,true)).join('')}</tbody></table></div>` : '<div class="empty">Planlı ders yok</div>'}</div>
    ${toReview.length ? `<div class="card" id="h-review"><h3>📝 Teslim edilen ödevler</h3><div class="tbl-wrap"><table><thead><tr><th>Teslim</th><th>Öğrenci</th><th>Ödev</th></tr></thead><tbody>${toReview.map(h=>`<tr class="click" onclick="location.hash='#/course/${h.course_id}'"><td>${fmtDT(h.submitted_at)}</td><td>${esc(h.tuition_courses.tuition_students.full_name)}</td><td>${esc(h.title)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    <p class="muted small">Saatler tarayıcınızın saat diliminde gösterilir.</p>`;
}

// ---------------------------------------------------------------------------
// OGRENCILER
// ---------------------------------------------------------------------------
async function viewStudents(){
  const students = await q(db.from('tuition_students').select('id,full_name,email,age,occupation,level,status,tutor_id,source,created_at').order('created_at',{ascending:false}));
  $('view').innerHTML = `
    <div class="card">
      <div class="row between" style="margin-bottom:14px">
        <h3 style="margin:0">Öğrenciler (${students.length})</h3>
        <div class="row"><input class="form-inp" id="stSearch" placeholder="Ara: ad, e-posta, meslek" style="width:240px" oninput="filterStudents()"><button class="btn" onclick="newStudentModal()">+ Yeni öğrenci</button></div>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Ad</th><th>E-posta</th><th>Yaş</th><th>Meslek</th><th>Seviye</th>${ME.is_admin?'<th>Öğretmen</th>':''}<th>Durum</th><th>Kayıt</th></tr></thead>
      <tbody id="stBody">${students.map(s=>`<tr class="click" data-s="${esc((s.full_name+' '+(s.email||'')+' '+(s.occupation||'')).toLowerCase())}" onclick="location.hash='#/student/${s.id}'">
        <td><b>${esc(s.full_name)}</b></td><td>${esc(s.email||'-')}</td><td>${s.age??'-'}</td><td>${esc(s.occupation||'-')}</td><td>${esc(s.level||'-')}</td>
        ${ME.is_admin?`<td>${esc(tutorName(s.tutor_id))}</td>`:''}<td>${badge(STUDENT_STATUS,s.status)}</td><td class="small">${fmtD(s.created_at)}</td></tr>`).join('') || `<tr><td colspan="8" class="empty">Henüz öğrenci yok</td></tr>`}</tbody></table></div>
    </div>`;
}

async function saveStudent(id){

async function updLesson(id, patch){ await run(()=>q(db.from('tuition_lessons').update(patch).eq('id', id)), 'Kaydedildi'); }
async function setAttendance(id, v){
  const { data: { user } } = await db.auth.getUser();
  await updLesson(id, { attendance: v, attendance_marked_at: v==='scheduled'?null:new Date().toISOString(), attendance_marked_by: v==='scheduled'?null:user.id });
  const prev = CUR.lessons.find(x=>x.id===id);
  if (v === 'cancelled' && prev && prev.calendar_event_id) { try { await invokeFn('tuition-meet', { action:'cancel_lesson', lesson_id: id }); toast('Takvim daveti iptal edildi'); } catch(e) { toast('Takvim iptal edilemedi: '+e.message, false); } }
  if (['attended','late'].includes(v) && !CUR.obs.find(o=>o.lesson_id===id)) { await viewCourse(CUR.c.id); obsModal(id); return; }
  viewCourse(CUR.c.id);
}
async function setCourseStatus(v){ await run(()=>q(db.from('tuition_courses').update({status:v}).eq('id', CUR.c.id)), 'Kur durumu güncellendi'); viewCourse(CUR.c.id); }
async function fillMeet(){
  const tutor = TUTORS.find(t=>t.id===CUR.c.tutor_id);
  const targets = CUR.lessons.filter(l=>!l.meet_link && l.attendance==='scheduled');
  if (!targets.length) { toast('Doldurulacak ders yok'); return; }
  await run(()=>Promise.all(targets.map(l=>q(db.from('tuition_lessons').update({meet_link: tutor.meet_link}).eq('id', l.id)))), targets.length+' derse Meet linki eklendi');
  viewCourse(CUR.c.id);
}

async function autoPlan(){
  const days = [...document.querySelectorAll('.ap_day:checked')].map(e=>parseInt(e.value));
  const start = val('ap_start'), time = val('ap_time');
  if (!days.length || !start || !time) { toast('Gun, başlangıç ve saat seçin', false); return; }
  const todo = CUR.lessons.filter(l=>!l.scheduled_at && l.attendance==='scheduled');
  if (!todo.length) { toast('Tarihi boş ders yok'); closeModal(); return; }
  const [hh, mm] = time.split(':').map(Number);
  const d = new Date(start + 'T00:00:00');
  const updates = [];
  let guard = 0;
  while (updates.length < todo.length && guard++ < 800) {
    if (days.includes(d.getDay())) { const x = new Date(d); x.setHours(hh, mm, 0, 0); updates.push(x.toISOString()); }
    d.setDate(d.getDate()+1);
  }
  await run(async()=>{
    await Promise.all(todo.map((l,i)=>q(db.from('tuition_lessons').update({ scheduled_at: updates[i] }).eq('id', l.id))));
    if (!CUR.c.start_date) await q(db.from('tuition_courses').update({ start_date: start }).eq('id', CUR.c.id));
  }, todo.length+' ders planlandı');
  closeModal(); viewCourse(CUR.c.id);
}

async function invokeFn(name, body){
  const { data, error } = await db.functions.invoke(name, { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); msg = j.error || msg; } catch(_) {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

async function saveQuiz(publish){

async function countOf(table, filter = x => x){
  const { count, error } = await filter(db.from(table).select('*', { count:'exact', head:true }));
  if (error) { console.error(table, error); return '!'; }
  return count ?? 0;
}

    <div id="um_body"><div class="empty">Yükleniyor...</div></div>`);

async function loadUsers(){
  const PS = 50;
  let qb = db.from('profiles').select('id,full_name,name,display_name,email,country,native_lang,level,created_at,last_active,is_premium,xp,streak', { count:'exact' });
  if (UM.country) qb = UM.country==='?' ? qb.or('country.is.null,country.eq.') : qb.ilike('country', UM.country);
  if (UM.activeDays) qb = qb.gte('last_active', new Date(Date.now()-UM.activeDays*864e5).toISOString());
  if (UM.newDays) qb = qb.gte('created_at', new Date(Date.now()-UM.newDays*864e5).toISOString());
  if (UM.search) { const t = UM.search.replace(/[%,()]/g,' '); qb = qb.or(`email.ilike.%${t}%,full_name.ilike.%${t}%,name.ilike.%${t}%`); }
  qb = qb.order(UM.order || 'created_at', { ascending:false, nullsFirst:false }).range(UM.page*PS, UM.page*PS+PS-1);
  const { data, count, error } = await qb;
  if (error) { $('um_body').innerHTML = `<div class="card">Hata: ${esc(error.message)}</div>`; return; }
  $('um_count').textContent = `${nf(count)} kişi`;
  const nm = u => u.full_name || u.display_name || u.name || (u.email||'').split('@')[0] || '-';
  $('um_body').innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Ad</th><th>E-posta</th><th>Ülke</th><th>Dil</th><th>Seviye</th><th>XP</th><th>Seri</th><th>Kayıt</th><th>Son giriş</th><th>Premium</th></tr></thead><tbody>
    ${data.map(u=>`<tr><td><b>${esc(nm(u))}</b></td><td class="small">${esc(u.email||'')}</td><td>${FLAGS[(u.country||'').toUpperCase()]||''} ${esc(u.country||'-')}</td><td>${esc(u.native_lang||'-')}</td><td>${esc(u.level||'-')}</td><td>${nf(u.xp)}</td><td>${nf(u.streak)}</td><td class="small">${fmtD(u.created_at)}</td><td class="small">${u.last_active?fmtD(u.last_active):'-'}</td><td>${u.is_premium?'<span class="badge b-gold">Premium</span>':''}</td></tr>`).join('') || '<tr><td colspan="10" class="empty">Kayıt yok</td></tr>'}
  </tbody></table></div>
  <div class="row" style="margin-top:12px">${UM.page>0?`<button class="btn ghost sm" onclick="UM.page--;loadUsers()">‹ Önceki</button>`:''}<span class="small muted">Sayfa ${UM.page+1} / ${Math.max(1,Math.ceil((count||0)/PS))}</span>${(UM.page+1)*PS<(count||0)?`<button class="btn ghost sm" onclick="UM.page++;loadUsers()">Sonraki ›</button>`:''}</div>`;
}
async function subsModal(){

// Pano API'si odak/izin yoksa sessizce reddediyor -> execCommand yedegi + her durumda geri bildirim
async function copyText(id){
  const el = $(id);
  el.focus(); el.select(); el.setSelectionRange(0, el.value.length);
  try { await navigator.clipboard.writeText(el.value); toast('Link kopyalandı'); return; } catch(_) {}
  try { if (document.execCommand('copy')) { toast('Link kopyalandı'); return; } } catch(_) {}
  toast('Otomatik kopyalanamadı: link seçildi, Cmd+C ile kopyalayın', false);
}
function showLinkModal(name, email, link, mailed, kind){
  const msg = `Merhaba ${name}, LearnTurkish AI Özel Ders Paneli için şifreni belirleyip giriş yapabileceğin link: ${link}`;
  openModal(`<h3>${kind==='invite'?'Öğretmen eklendi':'Giriş linki hazır'}</h3>
    <p class="small" style="margin-bottom:12px">${mailed ? `✅ Link <b>${esc(email||'')}</b> adresine e-postayla gönderildi. İsterseniz aşağıdan WhatsApp ile de iletebilirsiniz.` : `E-posta otomatik gönderilmedi (e-posta servisi henüz kurulmadı). Aşağıdaki linki öğretmene <b>WhatsApp veya e-postayla</b> iletin; öğretmen linke tıklayınca şifresini belirleyip panele girer.`}</p>
    <textarea class="form-inp" id="lk_link" rows="3" readonly onclick="this.select()">${esc(link)}</textarea>
    <p class="muted small" style="margin-top:8px">WhatsApp / e-posta düğmesi açılmazsa (bazı gömülü tarayıcılar engeller) linki kopyalayıp kendiniz yapıştırın. Link tek kullanımlıktır ve kısa süre (varsayılan 24 saat) geçerlidir. Süresi dolarsa "Giriş linki gönder" ile yenisini üretin.</p>
    <div class="row" style="margin-top:14px">
      <button class="btn" onclick="copyText('lk_link')">Linki kopyala</button>
      <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}">WhatsApp ile gönder</a>
      ${email?`<a class="btn ghost" style="text-decoration:none" href="mailto:${esc(email)}?subject=${encodeURIComponent('LearnTurkish AI - Öğretmen paneli')}&body=${encodeURIComponent(msg)}">E-postayla gönder</a>`:''}
      <button class="btn ghost" onclick="closeModal()">Kapat</button></div>`);
}
async function sendTutorLink(id){
  const t = TUTORS.find(x=>x.id===id);
  const r = await run(()=>invokeFn('tuition-admin', { action:'send_login_link', tutor_id: id }));
  if (r.link) showLinkModal(t ? t.full_name : '', r.email, r.link, r.mailed, 'login');
}

// ---------------------------------------------------------------------------
// Şifremi unuttum + davet / şifre sıfırlama linkinden dönüş
// ---------------------------------------------------------------------------
async function forgotPassword(){
  const email = $('email').value.trim();
  if (!email) { showLoginError('Önce e-posta adresinizi yazın'); return; }
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/teach' });
  if (error) { showLoginError('Gönderilemedi: ' + error.message); return; }
  const e = $('loginError'); e.style.display='block'; e.style.color='var(--green)';
  e.textContent = 'Şifre belirleme linki gönderildi. E-postanızı kontrol edin.';
}
function showSetPassword(kind){
  $('login').innerHTML = `<div class="login-box">
    <div style="font-size:44px;margin-bottom:14px">🔑</div>
    <h1>${kind==='invite'?'Hoş geldiniz':'Yeni şifre'}</h1>
    <p>${kind==='invite'?'LearnTurkish AI Özel Ders Paneli için şifrenizi belirleyin.':'Hesabınız için yeni bir şifre belirleyin.'}</p>
    <input type="password" class="inp" id="np1" placeholder="Yeni şifre (en az 8 karakter)" autocomplete="new-password">
    <input type="password" class="inp" id="np2" placeholder="Yeni şifre (tekrar)" autocomplete="new-password" onkeydown="if(event.key==='Enter')setNewPassword()">
    <button class="btn block" id="npBtn" onclick="setNewPassword()">Şifreyi kaydet ve giriş yap</button>
    <div class="error" id="loginError"></div></div>`;
  $('login').style.display='flex';
  $('np1').focus();
}
async function setNewPassword(){
  const p1 = $('np1').value, p2 = $('np2').value;
  if (p1.length < 8) { showLoginError('Şifre en az 8 karakter olmalı'); return; }
  if (p1 !== p2) { showLoginError('Şifreler aynı değil'); return; }
  $('npBtn').disabled = true;
  const { error } = await db.auth.updateUser({ password: p1 });
  $('npBtn').disabled = false;
  if (error) { showLoginError('Kaydedilemedi: ' + error.message); return; }
  location.hash = '#/home';
  await enter();
}
async function consumeAuthRedirect(){
  // Davet / sifre sifirlama linki: #access_token=...&refresh_token=...&type=invite|recovery
  const h = location.hash.replace(/^#/, '');
  if (!/access_token=|error_description=/.test(h)) return false;
  const p = new URLSearchParams(h);
  history.replaceState(null, '', location.pathname);
  if (p.get('error_description')) { showLoginError('Link geçersiz ya da süresi dolmuş: ' + p.get('error_description').replace(/\+/g,' ') + '. "Şifremi unuttum" ile yeni link isteyin.'); return true; }
  const { error } = await db.auth.setSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token') });
  if (error) { showLoginError('Link geçersiz ya da süresi dolmuş. "Şifremi unuttum" ile yeni link isteyin.'); return true; }
  showSetPassword(p.get('type') === 'invite' ? 'invite' : 'recovery');
  return true;
}

// ---------------------------------------------------------------------------
window.addEventListener('load', async () => {
  if (await consumeAuthRedirect()) return;
  const { data: { session } } = await db.auth.getSession();
  if (session) await enter(); else $('email').focus();
});
</script>
